services:
  - type: web
    name: ciencia-pg
    env: docker
    dockerContext: .
    dockerfilePath: Dockerfile.all-in-one
    plan: starter
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ciencia-pg-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: ciencia-pg-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: ciencia-pg-redis
          property: port
      - key: APP_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: VITE_APP_NAME
        value: Ciencia
      - key: MAIL_MAILER
        value: log
      - key: QUEUE_CONNECTION
        value: redis
      - key: VITE_FRONTEND_URL
        value: "" # Leave empty to use request host in server.js
      - key: VITE_API_URL_CLIENT
        value: /api
      - key: APP_FRONTEND_URL
        value: "" # Leave empty to use request host
    disk:
      name: pg-storage
      mountPath: /app/backend/storage
      sizeGB: 1

  - type: redis
    name: ciencia-pg-redis
    plan: starter
    ipAllowList: [] # Only allow internal connections

databases:
  - name: ciencia-pg-db
    plan: starter
